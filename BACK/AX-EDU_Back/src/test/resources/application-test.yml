# 테스트 전용: H2 메모리 DB (PostgreSQL 호환 모드). @ActiveProfiles({"local", "test"}) 로 시드 데이터와 함께 쓴다.
# 실제 스키마(Flyway)는 PostgreSQL 전용 문법이라 여기서는 끄고 Hibernate 가 테이블을 만든다.
spring:
  datasource:
    url: jdbc:h2:mem:axedu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create

# 테스트에서는 .env 에 키가 있어도 OpenAI 를 부르지 않는다 (규칙 기반 대체 구현)
axedu:
  openai:
    api-key: ""
